name: Fork dev build (Linux deb)

# Fork-only: builds an unsigned .deb from build/** branches for local testing.
on:
    push:
        branches: ['build/**']

permissions:
    contents: read

jobs:
    linux-deb:
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install Linux system deps
              run: |
                  sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
                    libgtk-3-dev librsvg2-dev librsvg2-bin libgtk-3-bin \
                    libayatana-appindicator3-dev libsoup-3.0-dev libssl-dev \
                    libpipewire-0.3-dev clang libclang-dev \
                    libasound2-dev libopus-dev libpulse-dev \
                    desktop-file-utils xdg-utils patchelf

            - name: Install JS deps
              run: bun install --frozen-lockfile

            - name: Build deb
              run: bun run tauri build --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: splitwave-linux-deb
                  path: src-tauri/target/release/bundle/deb/*.deb
                  if-no-files-found: error
